<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição</title>
    <link rel="stylesheet" href="css_2/reset.css">
</head>
<body>
    <h1>Preencha os campos abaixo e garanta a sua vaga no nosso evento!</h1>
    <form action="#" method="post" id="formulario">

        <label for="nome">Nome</label>
        <input type="text" id="Nome" required placeholder="Seu Nome"> <br>

        <label for="email">Email</label>
        <input type="email" name="email" id="email" required placeholder="Seu email" title="Seu Email"> <br>

        <label for="telefone">Telefone</label>
        <input type="tel"  id="telefone" pattern="[0-9]{2} [0-9]{5}-[0-9]{4}" required  title="Formato esperado: XX xxxxx-xxxx" placeholder="Seu Telefone"><br>

        <p>Areas de interesses:</p>
        <label for="fotografia">Fotografia</label>
        <input type="checkbox" id="fotografia"> <br>


        <label for="artes" s>Artes</label>
        <input type="checkbox" id="artes"> <br>

        <label for="tecnologia">Fotografia</label>
        <input type="checkbox" id="tecnologia"> <br>


        <label for="opniao">Qual atividade gostaria de participar?</label>
        <textarea name="sla" id="opniao"></textarea> <br><br>

        <button type="submit">Enviar</button> <br> <br>
        
        
    </form>

    <a href="index_v2.html">
        <button>Voltar para a Pagina Inicial</button>
    </a>

</body>
</html>
